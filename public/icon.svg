<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Neural Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#312e81" stroke-width="6" stroke-dasharray="16 12"/>
  
  <!-- Circuit Nodes -->
  <circle cx="256" cy="96" r="10" fill="#38bdf8"/>
  <circle cx="256" cy="416" r="10" fill="#38bdf8"/>
  <circle cx="96" cy="256" r="10" fill="#6366f1"/>
  <circle cx="416" cy="256" r="10" fill="#6366f1"/>
  
  <line x1="256" y1="106" x2="256" y2="160" stroke="#4338ca" stroke-width="4"/>
  <line x1="256" y1="352" x2="256" y2="406" stroke="#4338ca" stroke-width="4"/>
  <line x1="106" y1="256" x2="160" y2="256" stroke="#4338ca" stroke-width="4"/>
  <line x1="352" y1="256" x2="406" y2="256" stroke="#4338ca" stroke-width="4"/>

  <!-- Central Hexagonal Neural Processor Core -->
  <polygon points="256,150 348,203 348,309 256,362 164,309 164,203" fill="url(#primaryGrad)" filter="url(#glow)"/>
  
  <!-- Inner Processor Matrix -->
  <polygon points="256,180 322,218 322,294 256,332 190,294 190,218" fill="#090d16" stroke="url(#accentGrad)" stroke-width="5"/>
  
  <!-- Core Spark / Intelligence Symbol -->
  <path d="M256 215 L267 245 L297 256 L267 267 L256 297 L245 267 L215 256 L245 245 Z" fill="#38bdf8"/>
  <circle cx="256" cy="256" r="6" fill="#ffffff"/>
</svg>
