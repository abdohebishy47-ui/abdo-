    <script>
      // Gracefully ignore Vite WebSocket HMR errors in iframe preview
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (String(event.reason).includes('WebSocket') || String(event.reason.message).includes('WebSocket'))) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event && (String(event.message).includes('WebSocket') || String(event.error).includes('WebSocket'))) {
          event.preventDefault();
        }
      });
    </script>
